[package]
name = "carbondb-node"
description = "Node bindings for the CarbonDB core, through napi-rs"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
carbondb-core = { path = "../core" }
napi = { version = "3.16.1", features = ["serde-json"] }
napi-derive = "3.7.0"
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
napi-build = "2.6.0"
