[package]
name = "carbondb"
description = "CarbonDB: spaces on SQLite, its builtin services, and the one path every call takes to the services a device runs"
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["database", "local-first", "sqlite", "p2p", "sync"]
categories = ["database-implementations"]

[dependencies]
carbondb-service-bindings = { workspace = true, features = ["manifest"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
self_cell = "1.2.1"
service-key = "0.6.0"
sqlparser = { version = "=0.63.0", features = ["visitor"] }
toml = "1.1.8"

[build-dependencies]
carbondb-service-bindings = { workspace = true, features = ["build"] }

[dev-dependencies]
tempfile = "3"
