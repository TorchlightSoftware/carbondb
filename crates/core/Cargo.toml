[package]
name = "carbondb-core"
description = "CarbonDB's core: spaces on SQLite, the services this device runs, and the one path every call takes to them"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
carbondb-service-bindings = { path = "../service-bindings" }
carbondb-space = { path = "../services/space" }
carbondb-identity = { path = "../services/identity" }
carbondb-device = { path = "../services/device" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
self_cell = "1.2.1"
service-key = "0.6.0"
sqlparser = { version = "=0.63.0", features = ["visitor"] }
toml = "1.1.8"

[dev-dependencies]
tempfile = "3"
