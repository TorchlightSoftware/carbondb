[package]
name = "carbondb"
description = "CarbonDB: spaces on SQLite, its builtin services, and the one path every call takes to the services a device runs"
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["database", "local-first", "sqlite", "p2p", "sync"]
categories = ["database-implementations"]

[dependencies]
carbondb-service-bindings = { workspace = true, features = ["manifest"] }
carbondb-svc-channel.workspace = true
carbondb-svc-identity.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
self_cell = "1.2.1"
service-key = "0.6.0"
sqlparser = { version = "=0.63.0", features = ["visitor"] }
toml = "1.1.8"
rand = { version = "0.10.1", default-features = false, features = ["std_rng"] }
tokio = { version = "1.54.1", features = ["sync", "rt", "rt-multi-thread", "time", "net", "macros"] }
tokio-stream = "0.1"
p2panda = "0.8.1"
p2panda-encryption = "0.8.1"
p2panda-spaces = "0.8.1"
getrandom = "0.4.3"
wasmtime = { version = "=50.0.1", default-features = false, features = ["runtime", "cranelift", "component-model", "component-model-async", "async", "std", "cache", "parallel-compilation"] }
wasmtime-wasi = { version = "=50.0.1", default-features = false, features = ["p2", "p3"] }
wasmtime-wasi-http = { version = "=50.0.1", default-features = false, features = ["p2", "p3", "default-send-request", "component-model-async"] }
base64 = "0.22.1"
bytes = "1.12.1"
http = "1"
http-body-util = "0.1.5"

[dev-dependencies]
tempfile = "3"
iroh-relay = { version = "1.4.1", features = ["server"] }
