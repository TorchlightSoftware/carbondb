[package]
name = "carbondb-svc-identity"
description = "[identity], a builtin CarbonDB service, built as a WebAssembly component the core embeds"
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
publish = false

[lib]
# A component for wasm32-wasip2, and a library for the core's own use of its pure functions.
crate-type = ["cdylib", "rlib"]

[dependencies]
carbondb-service-bindings.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
carbondb-service-bindings = { workspace = true, features = ["guest"] }
