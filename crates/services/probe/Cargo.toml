[package]
name = "carbondb-svc-probe"
description = "[probe], a test fixture: a service that reports what it sees of its host, built as a component for the core's tests"
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
carbondb-service-bindings.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
carbondb-service-bindings = { workspace = true, features = ["guest"] }
getrandom = "0.3"
wasip2 = "1.0.4"
