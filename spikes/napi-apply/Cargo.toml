[package]
name = "napi-apply"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.16.1", features = ["serde-json"] }
napi-derive = "3.7.0"
rusqlite = { version = "=0.39.0", features = ["bundled", "hooks", "serde_json"] }
serde_json = "1"

[build-dependencies]
napi-build = "2.6.0"
