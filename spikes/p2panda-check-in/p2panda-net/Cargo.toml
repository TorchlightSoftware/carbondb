[package]
edition = "2024"
rust-version = "1.96"
name = "p2panda-net"
version = "0.8.1"
authors = [
    "adz <x12@adz.garden>",
    "sandreae <contact@samandreae.com>",
    "glyph <glyph@mycelial.technology>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Data-type-agnostic p2p networking, discovery, gossip and local-first sync"
readme = "README.md"
keywords = [
    "p2p",
    "local-first",
    "sync",
    "gossip",
    "discovery",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/p2panda/p2panda"
resolver = "2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
address_book = [
    "p2panda-store/macros",
    "p2panda-store/sqlite",
]
default = [
    "address_book",
    "iroh_endpoint",
    "iroh_mdns",
    "discovery",
    "gossip",
    "sync",
]
discovery = [
    "address_book",
    "iroh_endpoint",
    "dep:p2panda-discovery",
]
gossip = [
    "address_book",
    "iroh_endpoint",
    "dep:iroh-gossip",
]
iroh_endpoint = [
    "address_book",
    "dep:iroh",
]
iroh_mdns = [
    "iroh_endpoint",
    "dep:iroh-mdns-address-lookup",
]
supervisor = []
# Spike: a node that starts holding a topic runs discovery at once with the nodes it already knows.
check-in = []
sync = [
    "address_book",
    "iroh_endpoint",
    "gossip",
    "dep:p2panda-sync",
]
test_utils = [
    "default",
    "supervisor",
    "dep:tracing-subscriber",
    "p2panda-core/test_utils",
    "p2panda-store/test_utils",
    "p2panda-discovery/test_utils",
]

[lib]
name = "p2panda_net"
path = "src/lib.rs"

[[example]]
