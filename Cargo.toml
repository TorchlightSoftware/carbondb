[workspace]
resolver = "3"
members = ["crates/core", "crates/node", "crates/service-api", "crates/services/*"]
# Spikes are standalone experiments with their own lockfiles.
exclude = ["spikes"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
rusqlite = { version = "=0.39.0", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
